name: Build about photo
on:
  push:
    paths:
      - '.tmp-about-foodtruck.b64'
      - '.tmp-about-foodtruck-2.b64'
      - '.tmp-about-foodtruck-3.b64'
      - '.tmp-about-foodtruck-4.b64'
      - '.tmp-about-foodtruck-5.b64'
      - '.tmp-about-foodtruck-6.b64'
      - '.github/workflows/build-about-photo.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble photo
        run: |
          cat .tmp-about-foodtruck.b64 .tmp-about-foodtruck-2.b64 .tmp-about-foodtruck-3.b64 .tmp-about-foodtruck-4.b64 .tmp-about-foodtruck-5.b64 .tmp-about-foodtruck-6.b64 > /tmp/about.b64
          base64 -d /tmp/about.b64 > assets/about-foodtruck.webp
          rm .tmp-about-foodtruck.b64 .tmp-about-foodtruck-2.b64 .tmp-about-foodtruck-3.b64 .tmp-about-foodtruck-4.b64 .tmp-about-foodtruck-5.b64 .tmp-about-foodtruck-6.b64
          rm .github/workflows/build-about-photo.yml
      - name: Commit photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add about page foodtruck photo"
          git push
